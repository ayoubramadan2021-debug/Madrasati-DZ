<svg xmlns="http://www.w3.org/2000/svg"
      width="720" height="720" viewBox="0 0 720 720">
      <defs>
        <linearGradient id="sky" x1="0" y1="0"
          x2="0" y2="1">
          <stop offset="0" stop-color="#DDF5FF"/>
          <stop offset=".72" stop-color="#FFF0BE"/>
          <stop offset="1" stop-color="#F7D98A"/>
        </linearGradient>
        <linearGradient id="shine" x1="0" y1="0"
          x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"
            stop-opacity=".75"/>
          <stop offset=".3" stop-color="#FFFFFF"
            stop-opacity=".05"/>
          <stop offset="1" stop-color="#FFFFFF"
            stop-opacity="0"/>
        </linearGradient>
        <filter id="shadow" x="-30%" y="-30%"
          width="160%" height="160%">
          <feDropShadow dx="0" dy="12" stdDeviation="10"
            flood-color="#183B63" flood-opacity=".24"/>
        </filter>
      </defs>

      <rect width="720" height="720" rx="42"
        fill="url(#sky)"/>

      <circle cx="88" cy="92" r="35"
        fill="#FFD35A"/>

      <g opacity=".9">
        <circle cx="610" cy="126" r="32"
          fill="#FFFFFF"/>
        <circle cx="650" cy="129" r="23"
          fill="#FFFFFF"/>
        <circle cx="574" cy="135" r="22"
          fill="#FFFFFF"/>
      </g>

      <path d="M0 584 Q150 520 310 585
        T720 570 V720 H0Z"
        fill="#8ED477"/>

      <path d="M0 625 Q190 565 370 625
        T720 610 V720 H0Z"
        fill="#64BD66" opacity=".8"/>

      <rect x="28" y="28" width="664" height="664"
        rx="38" fill="none" stroke="#3B82F6"
        stroke-width="8" opacity=".92"/>


        <rect x="105" y="36" width="510" height="62"
          rx="31" fill="#ffffff" fill-opacity=".94"/>
        <text x="360" y="78" text-anchor="middle"
          direction="rtl" font-family="Tahoma,Arial"
          font-size="28" font-weight="800"
          fill="#183B63">المقعد الأزرق</text>


      <g filter="url(#shadow)">
        <rect x="205" y="300" width="310"
          height="82" rx="18" fill="#3B82F6"/>
        <rect x="233" y="390" width="31"
          height="110" rx="9"
          fill="#8B5E3C"/>
        <rect x="456" y="390" width="31"
          height="110" rx="9"
          fill="#8B5E3C"/>
        <path d="M223 327 H497"
