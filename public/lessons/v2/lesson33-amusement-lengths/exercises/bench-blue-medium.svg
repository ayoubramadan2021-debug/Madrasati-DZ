      </g>
      <rect x="245" y="545" width="39" height="35" rx="8" fill="#3B82F6" stroke="#fff" stroke-width="3"/><rect x="291" y="545" width="39" height="35" rx="8" fill="#3B82F6" stroke="#fff" stroke-width="3"/><rect x="337" y="545" width="39" height="35" rx="8" fill="#3B82F6" stroke="#fff" stroke-width="3"/><rect x="383" y="545" width="39" height="35" rx="8" fill="#3B82F6" stroke="#fff" stroke-width="3"/><rect x="429" y="545" width="39" height="35" rx="8" fill="#3B82F6" stroke="#fff" stroke-width="3"/>


      <path d="M58 48 H280 Q200 118 90 250Z"
