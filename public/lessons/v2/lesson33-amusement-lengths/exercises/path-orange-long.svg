<svg xmlns="http://www.w3.org/2000/svg"
      width="720" height="720" viewBox="0 0 720 720">
      <defs>
        <linearGradient id="sky" x1="0" y1="0"
          x2="0" y2="1">
          <stop offset="0" stop-color="#DDF5FF"/>
          <stop offset=".72" stop-color="#FFF0BE"/>
          <stop offset="1" stop-color="#F7D98A"/>
        </linearGradient>
        <linearGradient id="shine" x1="0" y1="0"
          x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"
            stop-opacity=".75"/>
          <stop offset=".3" stop-color="#FFFFFF"
            stop-opacity=".05"/>
          <stop offset="1" stop-color="#FFFFFF"
            stop-opacity="0"/>
        </linearGradient>
        <filter id="shadow" x="-30%" y="-30%"
          width="160%" height="160%">
          <feDropShadow dx="0" dy="12" stdDeviation="10"
            flood-color="#183B63" flood-opacity=".24"/>
        </filter>
      </defs>

      <rect width="720" height="720" rx="42"
        fill="url(#sky)"/>

      <circle cx="88" cy="92" r="35"
