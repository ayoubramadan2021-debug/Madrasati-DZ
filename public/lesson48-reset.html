  <p>جاري مسح الكاش وفتح تمارين الدرس 48...</p>

  <script>
    (async function () {
      try {
        if ("serviceWorker" in navigator) {
          const registrations =
            await navigator.serviceWorker.getRegistrations();

          await Promise.all(
            registrations.map(
              registration =>
                registration.unregister()
            )
          );
        }

        if ("caches" in window) {
          const keys =
            await caches.keys();

          await Promise.all(
            keys.map(
              key => caches.delete(key)
            )
          );
        }
      } catch (error) {
        console.error(error);
      }

      window.location.replace(
        '/lesson-v2/lesson48/exercises?routefix=20260729_043648'
      );
    })();
  </script>
