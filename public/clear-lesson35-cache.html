<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>تحديث تمارين الدرس 35</title>

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background:
        linear-gradient(180deg,#edf9ff,#fff2c7);
      color: #173f70;
      font-family: Arial,sans-serif;
      text-align: center;
    }

    .card {
      max-width: 600px;
      padding: 28px 22px;
      border: 4px solid #fff;
      border-radius: 28px;
      background: rgba(255,255,255,.94);
      font-size: 21px;
      font-weight: 800;
      line-height: 1.8;
      box-shadow:
        0 18px 40px rgba(23,63,112,.14);
    }
  </style>
</head>

<body>
  <div class="card">
    جارٍ حذف النسخة القديمة وفتح واجهة الدرس الجديدة…
  </div>

  <script>
    (async () => {
      try {
        localStorage.clear();
        sessionStorage.clear();

        if ("serviceWorker" in navigator) {
          const registrations =
            await navigator.serviceWorker
              .getRegistrations();

          await Promise.all(
            registrations.map(
              registration =>
                registration.unregister()
            )
          );
        }

        if ("caches" in window) {
          const names = await caches.keys();

          await Promise.all(
            names.map(
              name => caches.delete(name)
            )
          );
        }
      } catch (error) {
        console.error(error);
      }

      location.replace(
        "/lesson-v2/35/exercises?fullscreen-termux=20260716_225622"
      );
    })();
  </script>
</body>
</html>
